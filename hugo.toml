baseURL = "https://allendior.com/"
locale = "en-us"
title = "Allen Dior"
theme = "PaperMod"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    label = "English"
    weight = 1
  [languages.fr]
    label = "Français"
    weight = 2
  [languages.hi]
    label = "हिन्दी"
    weight = 3
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "Allen Dior"
  description = "Allen Dior (legal name Allen Ghanghas) — AI agent builder and full-stack developer in Kelowna, BC. Creator of Hermes. Founder of Beaver Computing. Writing about tech, life, and building things that work."
  author = "Allen Dior"
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.label]
    text = "Allen"

  [params.homeInfoParams]
    Title = "Allen Dior"
    Content = "Building AI agents and writing about tech, life, and what it means to grow roots in a new place. Based in Kelowna, BC. (Legal name: Allen Ghanghas.)"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Allendior"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/allen-dior-724679274"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.schema]
    publisherType = "Person"
    sameAs = [
      "https://www.linkedin.com/in/allen-dior-724679274",
      "https://github.com/Allendior",
      "https://www.linkedin.com/company/crowdbust",
    ]

[taxonomies]
  category = "categories"
  tag = "tags"

[menu]
  [[menu.main]]
    identifier = "writing"
    name = "Writing"
    url = "/writing/"
    weight = 10
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30
  [[menu.main]]
    identifier = "now"
    name = "Now"
    url = "/now/"
    weight = 40
  [[menu.main]]
    identifier = "gallery"
    name = "Gallery"
    url = "/gallery/"
    weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]
