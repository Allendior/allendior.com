{{- define "main" }}
<div class="about-page">

  {{/* ── Cover photo ── */}}
  <div class="about-cover"
    {{- if .Params.cover_image }}
    style="background-image: url('{{ .Params.cover_image | relURL }}')"
    {{- end }}
    role="img"
    aria-label="Cover photo">
  </div>

  {{/* ── Profile photo — overlaps bottom of cover ── */}}
  <div class="about-profile-wrap">
    {{- if .Params.profile_image }}
    <img class="about-avatar"
         src="{{ .Params.profile_image | relURL }}"
         alt="Allen Ghanghas">
    {{- else }}
    <div class="about-avatar about-avatar-placeholder" aria-hidden="true">AG</div>
    {{- end }}
  </div>

  {{/* ── Name ── */}}
  <p class="about-name">Allen</p>

  {{/* ── Bio ── */}}
  <div class="about-content post-content md-content">
    {{- .Content }}
  </div>

</div>
{{- end }}
