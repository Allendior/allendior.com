<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/samarkan" rel="stylesheet">

<script>
/* ── i18n ── */
var AG_i18n = {
  en: {
    tagline:     'Building AI agents. Writing about tech, life, and Kelowna.',
    writing:     'Writing',
    projects:    'Projects',
    about:       'About',
    now:         'Now',
    gallery:     'Gallery',
    rss:         'Subscribe via RSS',
    wr_heading:  'Writing',
    wr_subtitle: 'Essays, tutorials, notes, and reflections on tech, life, and Kelowna.',
    wr_rss:      'Never miss a post — subscribe via RSS',
    cat_all:     'All',
    cat_tech:    'Tech',
    cat_life:    'Life',
    cat_builds:  'Builds',
    cat_kelowna: 'Kelowna'
  },
  fr: {
    tagline:     'Créer des agents IA. Écrire sur la tech, la vie et Kelowna.',
    writing:     'Écriture',
    projects:    'Projets',
    about:       'À propos',
    now:         'Maintenant',
    gallery:     'Galerie',
    rss:         "S'abonner via RSS",
    wr_heading:  'Écriture',
    wr_subtitle: 'Essais, tutoriels, notes et réflexions sur la tech, la vie et Kelowna.',
    wr_rss:      'Ne manquez rien — abonnez-vous via RSS',
    cat_all:     'Tous',
    cat_tech:    'Tech',
    cat_life:    'Vie',
    cat_builds:  'Projets',
    cat_kelowna: 'Kelowna'
  },
  hi: {
    tagline:     'एआई एजेंट बना रहा हूँ। तकनीक, जीवन और केलोना के बारे में लिख रहा हूँ।',
    writing:     'लेखन',
    projects:    'परियोजनाएं',
    about:       'मेरे बारे में',
    now:         'अभी',
    gallery:     'गैलरी',
    rss:         'RSS से जुड़ें',
    wr_heading:  'लेखन',
    wr_subtitle: 'तकनीक, जीवन और केलोना पर निबंध, ट्यूटोरियल और विचार।',
    wr_rss:      'कोई पोस्ट न छूटे — RSS से जुड़ें',
    cat_all:     'सभी',
    cat_tech:    'तकनीक',
    cat_life:    'जीवन',
    cat_builds:  'निर्माण',
    cat_kelowna: 'केलोना'
  }
};

function AG_applyLang(lang) {
  var t = AG_i18n[lang] || AG_i18n.en;

  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });

  /* toggle Devanagari font class */
  document.documentElement.classList.toggle('lang-hi', lang === 'hi');

  /* highlight active flag */
  document.querySelectorAll('.lang-btn').forEach(function (btn) {
    btn.classList.toggle('lang-active', btn.dataset.lang === lang);
  });

  localStorage.setItem('ag_lang', lang);
}

/* Event delegation on document — catches clicks regardless of when
   buttons are painted or whether they have individual listeners */
document.addEventListener('click', function (e) {
  var btn = e.target.closest('.lang-btn');
  if (btn && btn.dataset.lang) {
    e.stopPropagation();
    AG_applyLang(btn.dataset.lang);
  }
});

document.addEventListener('DOMContentLoaded', function () {
  /* Fall back to the page's own lang attribute so /fr/ shows French
     and /hi/ shows Hindi even on a first visit with no saved preference */
  var pageLang = (document.documentElement.lang || 'en').split('-')[0];
  AG_applyLang(localStorage.getItem('ag_lang') || pageLang);
});
</script>
